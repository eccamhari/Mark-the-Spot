<!DOCTYPE html>
<html>
    <link rel="stylesheet" href="limits.css">
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@100..900&display=swap" rel="stylesheet" />
 
    <script>
            window.MathJax = {
                tex: {
                    inlineMath: [['$', '$'], ['\\(', '\\)']],
                    displayMath: [['$$', '$$'], ['\\[', '\\]']]
                },
                svg: {
                    fontCache: 'global'
                }
            };
    </script>
    <script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>

    <body>
        <section class="main">
            <div class="main_con">
                <h1>Limits and Continuity Mini Quiz</h1>
                <p> This is a multiple choice quiz, it consists of 14 questions. You are given 5 minutes to answer each question. <b>Remember, </b> you can only pick 1 answer . <br><em> Kayang-kaya mo 'to !</em></p>
                <button class = "start_btn">Ready Na!</button>
            </div>
        </section>

        <div class="app">
            <h1>Limits and Continuity</h1>
            <p class ="logo">by <img src="images/logo.png" alt="Logo"></p>
            <div class="quiz">
                <h3 id="ques">Question</h3>
                <h4 id = "timer" role="timer" aria-live="polite"></h4>
                <div id="ans_btn">
                    <button class="btn" type="button">A</button>
                    <button class="btn" type="button">B</button>
                    <button class="btn" type="button">C</button>
                    <button class="btn" type="button">D</button>
                </div>
                <p id="sol" aria-live="polite"></p>
                <button id="next_btn" type="button">Next</button>
            </div>
        </div>
        <script src="limits.js"></script>
    </body>
</html>
